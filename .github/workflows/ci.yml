# Risk-based check selection (issue #551): the `select` job classifies the
# changed files into risk domains (scripts/ci/lib/risk-domains.mjs) and the
# database, build, and browser jobs run only when a matching domain changed.
# Prettier, ESLint, and the repository-owned Vitest suites always run.

name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    name: Risk Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_build: ${{ steps.select.outputs.run_build }}
      run_database: ${{ steps.select.outputs.run_database }}
      run_browser: ${{ steps.select.outputs.run_browser }}
      run_visual: ${{ steps.select.outputs.run_visual }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Select checks from changed risk domains
        id: select
        run: node scripts/ci/select-checks.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check:changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lint changed files
        run: pnpm lint:changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        project: [node, dom]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test ${{ matrix.project }} project
        run: pnpm test --project=${{ matrix.project }}
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
  production-build:
    name: Production Build
    # The production build remains the authoritative compilation and
    # route-generation gate; it is selected from changed risk domains
    # (application code, schema, or production configuration).
    needs: select
    if: needs.select.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
  # DB-backed integration suite (§60) against a disposable Postgres: canonical
  # Supabase migration history, then the demo fixture seed, then the opt-in
  # suites behind RUN_DATABASE_INTEGRATION_TESTS=1 (including live RLS).
  # Never points at hosted Supabase; the service container is the only
  # database involved. Selected from changed risk domains: schema/persistence
  # paths and every shared auth/role/response/publication domain expand the
  # selection to this suite.
  database-integration:
    name: Database Integration
    needs: select
    if: needs.select.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloie_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify disposable database target
        run: pnpm verify:database-target
      - name: Verify database suite completeness
        run: pnpm verify:database-suites
      - name: Apply migrations
        run: bash scripts/ci/apply-migrations.sh
      - name: Seed fixture
        run: pnpm db:seed
      - name: Run DB integration tests
        run: pnpm test:db
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
  # Browser-level user journeys (§61) plus the desktop and mobile axe sweeps
  # and the curated visual baseline (@visual, issue #551) against the seeded
  # fixture in production mode (next build + next start). Auth is the isolated
  # signed CI test session (cloie_ci_test_auth) restricted to the disposable
  # seeded database — no OAuth UI automation. Retries are disabled for
  # required checks; a red-then-green run is treated as flaky evidence, not a
  # clean pass. Selected from changed risk domains; the visual gate is a
  # separate output so it can be forced off (cross-browser scheduled runs).
  # Cross-browser (firefox/webkit) and the full matrix run on the bounded
  # schedule in scheduled.yml, not on every small PR.
  browser-e2e:
    name: Browser E2E
    needs: select
    if: needs.select.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloie_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cloie_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
      CONFIRMATION_SECRET: "ci-test-confirmation-secret-must-be-32-chars-long!!"
      CLOIE_CI_TEST_ENABLED: "true"
      CLOIE_DEPLOYMENT_KIND: "ci-test"
      CLOIE_CI_TEST_SESSION_SECRET: "ci-test-session-secret-must-be-32-chars-long-!!"
      CLOIE_CI_TEST_ALLOWED_USERS: "demo-ph@cloie.test,ph-beed@cloie.test,demo-faculty@cloie.test,faculty-bsed@cloie.test,faculty-bsba@cloie.test,faculty-bshm@cloie.test,demo-student@cloie.test,student-bsba@cloie.test,demo-grad@cloie.test,student-bsed@cloie.test,student-bshm@cloie.test,demo-secretary@cloie.test,demo-dean@cloie.test,demo-gened@cloie.test,demo-alumni@cloie.test,alumni-bsba@cloie.test,alumni-rejected@cloie.test,alumni-inactive@cloie.test,demo-industry@cloie.test,industry-bshm@cloie.test"
      CLOIE_E2E_VISUAL: ${{ needs.select.outputs.run_visual }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Apply migrations
        run: bash scripts/ci/apply-migrations.sh
      - name: Seed fixture
        run: pnpm db:seed
      - name: Create CI test marker file (independently verified CI identity)
        run: mkdir -p /tmp && touch /tmp/cloie-ci-test-marker && ls -l /tmp/cloie-ci-test-marker
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright journeys (production)
        run: pnpm exec playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
