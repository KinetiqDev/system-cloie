        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify demo reset isolation gate
        run: pnpm exec tsx scripts/ci/verify-demo-reset-gate.ts
