# Scheduled deep verification (issue #551).
#
# The full role, live RLS, visual, demo-reset gate, production-boundary, and
# cross-browser matrix runs on a bounded schedule instead of every small PR.
# PR CI (.depot/workflows/ci.yml) keeps the fast risk-selected gate; this
# workflow always runs the complete matrix, in parallel jobs, each with an
# explicit timeout and its own disposable database service.

name: Scheduled Deep Verification
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  unit:
    name: Unit Suites
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm vitest run --pool=forks --maxWorkers=4
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
  database-integration:
    name: Database Integration (live RLS)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloie_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify disposable database target
        run: pnpm verify:database-target
      - name: Verify database suite completeness
        run: pnpm verify:database-suites
      - name: Apply migrations
      - name: Seed fixture
        run: pnpm db:seed
      - name: Run DB integration tests
        run: pnpm test:db
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
