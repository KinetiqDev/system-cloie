  # Production authentication boundary: the dev-login endpoint and protected
  # routes are verified against a real production-mode server (§63/§64).
  production-boundary:
    name: Production Auth Boundary
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-testing
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Start production server
        run: |
          nohup pnpm start -p 3000 > /tmp/cloie-server.log 2>&1 &
          echo $! > /tmp/cloie-server.pid
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then
              echo "Server is up after ${i} polls."; exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready:"; cat /tmp/cloie-server.log; exit 1
      - name: Verify the production authentication boundary
        run: |
          PRODUCTION_EVIDENCE_BASE_URL=http://127.0.0.1:3000 pnpm verify:production-auth-boundary
      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/cloie-server.pid ]; then kill "$(cat /tmp/cloie-server.pid)" || true; fi
  # Demo reset gate: the isolation validator must refuse shared/hosted and
  # primary Production targets and accept only a self-consistent
  # dedicated-demo configuration. The reset itself never runs in CI.
  demo-reset-gate:
    name: Demo Reset Isolation Gate
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
