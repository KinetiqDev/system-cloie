schema: spec-driven

context: |
  # System CLOIE
  System CLOIE is a college-level, multi-program academic evaluation,
  learning-outcomes monitoring, analytics, and reporting system for
  Assumption College of Davao.

  It manages Program Learning Outcomes (PLOs), Institutional Learning Outcomes
  (ILOs), Course Intended Learning Outcomes (CILOs), evaluation instruments,
  controlled deployments, stakeholder responses, attainment analytics, qualitative
  summaries, and evidence reports.

  System CLOIE does not replace an LMS, SIS, grading system, or institutional
  accreditation platform.

  ## Sources of Truth
  Before proposing, designing, or implementing a change:
  1. Read CONTEXT-MAP.md.
  2. Read the relevant src/features/<domain>/CONTEXT.md files.
  3. Read applicable records under docs/adr/.
  4. Inspect existing code, tests, OpenSpec artifacts, and GitHub issues.
  5. Use terminology defined by the relevant CONTEXT.md file.
  6. Surface conflicts with an ADR instead of silently overriding it.

  OpenSpec artifacts define and approve change intent.
  GitHub Issues are the execution-tracking units produced from approved
  vertical slices through the Matt Pocock skills workflow.

  ## Current Core Stack
  - Framework: Next.js 16.2.x App Router with React 19.2.x and Turbopack
  - Language: TypeScript 5.x in strict mode
  - Package manager: pnpm 10.x; never use npm or yarn
  - Styling: Tailwind CSS 4.x, class-variance-authority, and tailwind-merge
  - UI: shadcn/ui base-nova style with @base-ui/react primitives
  - Icons: lucide-react
  - Forms: react-hook-form and Zod 4.x
  - Form resolver: customZodResolver from @/lib/forms/zod-resolver
  - Database: PostgreSQL hosted by Supabase
  - ORM: Prisma 6.x
  - Authentication: Supabase Auth with Google OAuth and SSR cookies
  - Charts: Recharts 3.x composed through shadcn/ui chart primitives
  - Qualitative processing: winkNLP, stopword, the existing word-cloud component,
    and the OpenAI-compatible server-side interpretation boundary
  - Unit/integration testing: Vitest and Testing Library
  - Static analysis: Fallow 2.54.3 through the project-local CLI
  - Deployment: Vercel and Supabase

  Do not install Radix UI packages.
  Do not install another charting library.
  Playwright is a planned E2E target, not an installed dependency or CI gate yet.
  TanStack Query is not a default dependency. Add it only when a design
  establishes a concrete need for client-owned asynchronous server state.

  ## Architecture
  - Modular monolith organized under src/features/<domain>/.
  - Split code by domain responsibility and cohesion, not arbitrary line count.
  - Generated files are exempt from handwritten-file LoC targets.
  - Server Components are the default.
  - Keep "use client" boundaries narrow and limited to state, hooks, browser APIs,
    event handlers, charts, drag-and-drop, and react-hook-form.
  - Fetch and authorize data in Server Components or server-only feature services.
  - Pass serializable prepared data into Client Components.
  - Server Actions live under src/lib/actions/ and must follow existing patterns
    in the affected domain.
  - Request/session handling enters through src/proxy.ts, not middleware.ts.
  - Supabase session refresh is implemented in src/lib/supabase/middleware.ts.
  - Path alias @/* maps to ./src/*.

  ## Rendering and Performance
  - Prefer route loading.tsx files, Suspense boundaries, and meaningful skeletons.
  - Parallelize independent server reads.
  - Avoid internal HTTP calls from Server Components when a server service can
    be called directly.
  - Do not move server-owned data fetching to the client merely to show loading UI.
  - Never shared-cache sessions, authorization decisions, user profiles,
    student identifiers, rosters, raw responses, or qualitative comments.
  - Cache only explicitly scoped catalog or aggregate data.
  - Every persistent cache must define its key dimensions, lifetime, tags,
    invalidation triggers, authorization boundary, and stale-data behavior.
  - Enabling Next.js Cache Components requires a separate reviewed change.

  ## Database Workflow
  - Prisma models are the application data-model source of truth.
  - Supabase migrations are the deployed SQL history and may contain constraints
    Prisma cannot represent.
  - Migration workflow:
    edit Prisma schema
    -> pnpm supabase:migration:diff -- <name>
    -> pnpm supabase:push:dry-run
    -> pnpm supabase:push
    -> pnpm supabase:types
  - Never hand-edit src/types/supabase-database.ts.
  - Never use Docker-backed supabase db pull or supabase db diff --linked.
  - Preserve SQL-only constraints and their documented Prisma mirrors.
  - Multi-file Prisma schemas must be organized by existing domain boundaries.
  - Database migrations must remain compatible with existing production data.

  ## Identity and Access
  - SystemRole values:
    SECRETARY, DEAN, PROGRAM_HEAD, FACULTY, STUDENT, ALUMNI,
    INDUSTRY_PARTNER, GEN_ED_COORDINATOR.
  - `GEN_ED_COORDINATOR` is a pre-provisioned single-role account. Provisioning requires an eligible institutional email and SHALL not require `program_id`. Self-service role claim SHALL reject the Coordinator role. All Coordinators share one college-wide General Education scope; no portfolio assignment table exists in this change.
  - Authorization for the approved General Education transfer is college-wide scope via `Course.course_scope == GENERAL_EDUCATION`. A portfolio-partitioned Coordinator model requires a separate approved capability and is not enabled by this change.
  - A CLOIE account has one active account role.
  - UserRole.user_id is unique; do not design multi-role or role-switching behavior
    unless an approved change intentionally replaces this invariant.
  - Authorization must be enforced server-side.
  - Role-owned routes and program/course scope checks must remain explicit.
  - Program Heads act within their Authorized Program set; Selected Program context
    is an operation context, not an account attribute.
  - CourseAssignmentMembership rows are the authoritative course roster source for
    publication and course-bound evaluation scope.
  - User.name is one opaque canonical account name; do not parse it into first-name
    or last-name components. Google-derived naming applies only at creation or the
    First OAuth link; later callbacks preserve the stored name.
  - Preserve account-state handling for onboarding, deferred enrollment,
    inactive accounts, rejected external accounts, and complete accounts.
  - Dedicated demo authentication and data are a separate security boundary from
    primary Production; never target primary Production with demo reset or bypass
    behavior.

  ## General Education Coordinator boundaries (approved in 477)
  - General Education assignment matrix (server-enforced after the approved transfer):
    SECRETARY: read-only General Education assignments; retains Program-specific assignment mutation (General Education mutation denied).
    DEAN: preserves current all-program mutation behavior for General Education and Program-specific assignments.
    GEN_ED_COORDINATOR: college-wide read and mutation for General Education assignments only (General Education predicate `course.course_scope == GENERAL_EDUCATION` enforced inside server services; Program-specific mutation denied).
    PROGRAM_HEAD: read-only General Education assignments within the Authorized Program set; mutation denied for General Education.
    FACULTY: read-only for own assignments; assignment mutation denied for every Faculty account.
  - Coordinator scope model: shared college-wide. Multiple Coordinators share the same `course.course_scope == GENERAL_EDUCATION` predicate. Separate portfolios require a new OpenSpec capability and assignment model.
  - First analytics release: Course-bound General Education evidence only (`course.course_scope == GENERAL_EDUCATION`, submitted Course-bound responses). Central Deployments are excluded from Coordinator analytics. ILO attainment and ILO-to-PLO crosswalks are not part of this change.
  - Deferred: Institutional Learning Outcome catalog ownership and write authority. The ILO ownership/write conflict (ADR 0005 / `introduce-institutional-learning-outcomes` vs `secretary-outcome-access-removal` and live denial) is recorded as deferred. This change adds no ILO catalog mutation path; current denial behavior is preserved.

  ## Analytics and AI boundary
  - Deterministic aggregate analytics remains the authoritative evidence surface.
  - AI-assisted interpretation is supplementary and server-side only: authorize
    evidence before processing, de-identify and bound the qualitative corpus,
    validate aggregate-derived output, return no raw qualitative text to the
    browser, persist no AI result or response text, and keep production enablement
    as a separate governance decision.

  ## Database test safety
  - Never run database integration tests against shared hosted Supabase.
  - Database invariant tests require RUN_DATABASE_INTEGRATION_TESTS=1 and a
    disposable test database.

  ## Static analysis
  - Fallow full-project reports are read-only and informational; the CI gate checks
    only new baseline-unmatched findings in changed files.
  - Trace findings before deleting or refactoring. Treat Next.js entry points,
    route handlers, Server Actions, generated Supabase types, shadcn/ui inventory,
    dynamic consumers, and CONTEXT.md files as protected categories.
  - Fallow mutation and baseline refresh are human-gated; begin fixes with dry-run
    evidence and review the resulting diff.
  - Enforced Fallow boundaries are limited to the configured ui-primitives/shared
    and shared/types seams; add a new boundary only through a focused proposal.

  ## User-facing verification
  - Significant UI changes must preserve desktop and mobile behavior, keyboard
    access, accessibility states, and responsive touch targets.
  - Verify the affected workflow in the running application when practical; tests
    and builds do not replace behavioral UI verification.

  ## Canonical outcomes vocabulary
  - Use Institutional Learning Outcome (ILO), Program Learning Outcome (PLO), and
    Course Intended Learning Outcome (CILO) as canonical terms.
  - The legacy Graduate Outcome term is retired. Persisted GO codes and legacy
    GRADUATE_OUTCOME snapshot values are historical data, not user-facing terms.
  - Typed mappings require a manifestation; manifestations are LEARNING, PRACTICE,
    or OPPORTUNITY and carry no numeric weight.
  - Publication alignment is a server-side gate, and outcome readiness follows the
    typed rules in the Outcomes CONTEXT.md.

  ## PWA
  - The metadata manifest and installable shell exist.
  - Service-worker and offline-data implementation are deferred by ADR 0006.
  - Do not add Serwist, Workbox, next-pwa, offline mutation queues, or offline
    caches unless that ADR is reopened through a dedicated change.

  ## Verification
  - Lint: pnpm lint
  - Unit/integration tests: pnpm test
  - Focused test: pnpm vitest run <path>
  - Production build and typecheck: pnpm build
  - E2E target: Playwright after the dependency and CI workflow are added

  ## Commit Convention
  Conventional Commits:
  <type>(<scope>): <imperative description>

  Allowed types:
  feat, fix, refactor, perf, style, test, docs, build, ops, chore

  Use lowercase descriptions, imperative present tense, and no trailing period.

rules:
  proposal:
    - "Read CONTEXT-MAP.md, relevant CONTEXT.md files, applicable ADRs, existing code, tests, and related GitHub issues before proposing."
    - "Classify the change as feature, fix, refactor, performance, documentation, or infrastructure work."
    - "State what already exists, what is changing, and what remains unchanged."
    - "Identify affected domain contexts and feature modules."
    - "Keep unrelated refactoring, performance work, and new behavior in separate changes unless they are inseparable."
    - "State whether the change affects the Prisma model, SQL migrations, generated Supabase types, authorization, privacy, caching, or deployment."
    - "Mark breaking behavior or data changes with **BREAKING**."
    - "For refactors, name the behavioral invariants that must remain unchanged."
    - "For performance work, identify the measured or observable problem instead of assuming caching is the solution."

  specs:
    - "Specify observable behavior rather than internal implementation."
    - "Use Requirement and Scenario sections compatible with OpenSpec conventions."
    - "Use Given/When/Then wording for behavioral scenarios."
    - "Use exact domain terms and exact SystemRole values."
    - "Cover authorization scope, account state, empty state, error state, loading state, and relevant boundary cases."
    - "Do not add multi-role scenarios unless the proposal intentionally changes the current single-role invariant."
    - "Every requirement must have a verifiable acceptance condition."

  design:
    - "Follow existing feature boundaries and domain vocabulary."
    - "List exact project-relative paths for files to create, modify, move, or delete."
    - "Define Server Component and Client Component boundaries."
    - "Justify every new use client boundary."
    - "For charts, prepare and authorize data on the server and render through shadcn/ui chart primitives plus Recharts."
    - "For caching, include a cache matrix covering key, scope, lifetime, tags, invalidation, authorization boundary, and stale behavior."
    - "For schema changes, include the Prisma and Supabase migration sequence and rollback or recovery approach."
    - "Never propose manual edits to generated Supabase database types."
    - "Use sequence diagrams only for complex authorization, stateful, asynchronous, or multi-step interactions."
    - "Record durable architectural decisions in an ADR when the design introduces or reverses a cross-cutting constraint."

  tasks:
    - "Organize implementation into dependency-ordered vertical slices, not separate schema, backend, frontend, and test phases."
    - "Each vertical slice must deliver a testable behavior or preserve a named refactor invariant end to end."
    - "A slice may include schema, server logic, UI, tests, and documentation when all are required for that behavior."
    - "Make each slice suitable for conversion into a focused GitHub issue through to-tickets."
    - "For each slice include scope, affected paths, acceptance criteria, verification commands, and a proposed Conventional Commit message."
    - "Place required database migrations before code that depends on the migrated shape."
    - "Finish each slice with focused tests, pnpm lint, relevant Vitest or Playwright checks, and pnpm build when the slice affects production compilation."
