function pct(a,b){return b?Math.round(a/b*100):0}
function mean(v){return v==null?'—':Number(v).toFixed(2)}
function sum(a){return a.reduce((x,y)=>x+y,0)}
function weightedMean(counts){const total=sum(counts);if(!total)return null;return counts.reduce((acc,c,i)=>acc+c*(i+1),0)/total}
function distributionForMean(target,total=100){
 if(target==null||!total)return [0,0,0,0,0];
 const sigma=.95; let raw=[1,2,3,4,5].map(v=>Math.exp(-Math.pow(v-target,2)/(2*sigma*sigma)));
 const rs=sum(raw); let counts=raw.map(v=>Math.max(0,Math.round(v/rs*total))); let diff=total-sum(counts); counts[3]+=diff;
 const desired=Math.round(target*total); let current=Math.round(counts.reduce((a,c,i)=>a+c*(i+1),0)); let guard=0;
 while(current!==desired&&guard++<500){
   if(current<desired){let moved=false;for(let i=3;i>=0;i--){if(counts[i]>0){counts[i]--;counts[i+1]++;current++;moved=true;break}}if(!moved)break}
   else {let moved=false;for(let i=1;i<5;i++){if(counts[i]>0){counts[i]--;counts[i-1]++;current--;moved=true;break}}if(!moved)break}
 }
 return counts;
}
function likertBlock(counts,labels=['1','2','3','4','5']){const total=sum(counts);const wm=weightedMean(counts);return `<div class="likert" aria-label="Likert distribution">${counts.map((v,i)=>`<span class="l${i+1}" style="width:${total?v/total*100:0}%" title="${labels[i]}: ${v} ratings"></span>`).join('')}</div><div class="dist-labels">${counts.map((v,i)=>`<span>${labels[i]} · ${v}</span>`).join('')}</div><div class="dist-summary"><span><strong>${total}</strong> valid ratings</span><span>Weighted mean from these counts: <strong>${mean(wm)} / 5</strong></span></div><details class="exact-values"><summary>Show exact values</summary><div class="table-wrap"><table class="table"><thead><tr><th>Rating</th><th>Label</th><th class="right">Count</th><th class="right">Share</th></tr></thead><tbody>${counts.map((v,i)=>`<tr><td class="strong">${i+1}</td><td>${labels[i]}</td><td class="right">${v}</td><td class="right">${total?(v/total*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div></details>`}
function courseQuestionData(c){
 if(!c||!c.submitted||c.mean==null)return [];
 const n=c.submitted; const base=c.mean; const defs=[
  ['Q1','I can apply the concepts and skills described in the first course outcome.','CILO 1',Math.min(4.9,base+.12)],
  ['Q2','I can select and use strategies appropriate to the learning task.','CILO 2',Math.max(1.1,base-.14)],
  ['Q3','The evaluation instructions and expectations were clear.',null,Math.min(4.9,base+.02)],
  ['Q4','The learning activities were organized in a way that supported the evaluation.',null,Math.max(1.1,base-.05)],
  ['Q5','I can reflect on my practice and explain how I would improve it.','CILO 3',Math.min(4.9,base+.08)]
 ];
 return defs.map(([id,text,cilo,target])=>{const dist=distributionForMean(target,n);return {id,text,cilo,dist,mean:weightedMean(dist),ratings:sum(dist)}})
}
function courseEvaluationStats(c){const qs=courseQuestionData(c);const ratings=qs.flatMap(q=>q.dist.flatMap((count,i)=>Array(count).fill(i+1)));return {questions:qs,mean:ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:null,ratingCount:ratings.length,boundQuestions:qs.filter(q=>q.cilo),generalQuestions:qs.filter(q=>!q.cilo)}}
function responseMean(values){return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}

function analyticsQualitative(){
 const srcRows=[['Course evaluations',92,67],['Program-wide students',31,24],['Alumni',36,20],['Industry partners',27,13]].map(([s,a,r])=>`<div class="bar-row"><div class="bar-label">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${a/92*100}%"></div></div><div class="bar-value">${a}</div></div>`).join('');
 const prompts=[['What worked well?',63],['What should be improved?',58],['Additional comments',42],['How did the course support your learning?',23]].map(([s,a])=>`<div class="bar-row"><div class="bar-label" title="${s}">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${a/63*100}%;background:var(--chart-2)"></div></div><div class="bar-value">${a}</div></div>`).join('');
 const terms=mock.qualitative.all.slice(0,10).map(([t,m],i)=>`<tr><td class="strong">${t}</td><td class="right">${m}</td><td class="right">${Math.max(2,m-Math.floor(m*.25))}</td><td><button class="btn link small" data-route="responses">View matching responses</button></td></tr>`).join('');
 const body=`<div class="source-note"><strong>Qualitative boundary:</strong> comments retain source, evaluation and prompt provenance. CLOIE does not infer a PLO from a comment unless a future model explicitly binds qualitative prompts to outcomes.</div><div class="summary-strip">${miniStat('Respondents','124','At least one qualitative answer')}${miniStat('Qualitative answers','186','Across all prompts')}${miniStat('Evaluations','9','Course and program-wide')}${miniStat('Top term','laboratory','47 mentions')}</div><div class="two-col"><section class="card card-pad"><div class="card-head"><div><h2>Where feedback came from</h2><div class="card-title-sub">Counts stay tied to evidence source.</div></div></div><div class="chart-bars">${srcRows}</div></section><section class="card card-pad"><div class="card-head"><div><h2>Prompt coverage</h2><div class="card-title-sub">Qualitative questions are not treated as interchangeable.</div></div></div><div class="chart-bars">${prompts}</div></section></div><section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Word cloud</h2><div class="card-title-sub">Hover terms for mention count. Use source chips to change the vocabulary set.</div></div><button class="btn small" data-route="responses">Browse contributing responses ${icon('arrow')}</button></div>${qualCloud()}</section><section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Top terms with evidence links</h2><div class="card-title-sub">Mentions and number of responses containing each term are separated.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Term</th><th class="right">Mentions</th><th class="right">Responses containing term</th><th></th></tr></thead><tbody>${terms}</tbody></table></div></section>`;
 return analyticsShell(body);
}

function analyticsAI(){
 const body=`<div class="ai-hero"><div><h2>AI-assisted review</h2><p class="card-title-sub">Uses server-computed aggregate evidence only. Named respondents and raw comments stay outside this view.</p></div><button class="btn primary" id="generateAI">Generate insight</button></div><div class="ai-result" id="aiResult" style="margin-top:16px"><div class="source-note"><strong>Evidence considered:</strong> 312 submitted assignments, 1,885 quantitative ratings, 186 qualitative answers summarized into aggregate tokens, selected period 2026-2027 First Semester.</div><div class="insight-list"><div class="insight-card"><h3>Possible strengths</h3><ul><li>PLO 1 has consistent quantitative evidence across several course assignments.</li><li>Student completion is higher in Morning sections than in Afternoon sections in this mock scope.</li></ul></div><div class="insight-card"><h3>Areas worth reviewing</h3><ul><li>PLO 3 has less course evidence than the other outcomes.</li><li>Several active evaluations still have more than 20 percent incomplete assignments.</li></ul></div><div class="insight-card"><h3>Recurring themes</h3><ul><li>Laboratory, projects and practice appear frequently in course feedback.</li><li>Communication and confidence appear across graduating student and alumni feedback.</li></ul></div><div class="insight-card"><h3>Questions for human review</h3><ul><li>Are the courses contributing to PLO 3 scheduled late enough to explain the thinner evidence?</li><li>Do section-level completion differences warrant an operational follow-up?</li></ul></div></div><section class="card card-pad" style="margin-top:16px"><h3>Limitations</h3><p class="card-title-sub" style="margin-top:6px">This summary does not establish causality or make curriculum decisions. It interprets only the aggregates available in this filtered view.</p></section></div>`;
 return analyticsShell(body);
}
function analytics(){if(state.analyticsTab==='courses')return analyticsCourses();if(state.analyticsTab==='stakeholders')return analyticsStakeholders();if(state.analyticsTab==='trends')return analyticsTrends();if(state.analyticsTab==='qualitative')return analyticsQualitative();if(state.analyticsTab==='ai')return analyticsAI();return analyticsOutcomes()}

function courseDetail(id){
 const c=mock.courses.find(x=>x.id===id)||mock.courses[0]; const res=mock.respondents.filter(r=>r.course===id); const names=(res.length?res:mock.respondents.slice(0,5)); const st=courseEvaluationStats(c); const qs=st.questions;
 const respondentRows=names.map(r=>`<tr class="clickable" data-route="responses/course/${c.id}/responses/${r.id}"><td><span class="strong linkish">${r.name}</span></td><td>${r.major}</td><td>${r.year}</td><td>${r.section}</td><td>${r.submitted}</td><td class="right">${mean(r.mean)}</td><td>${icon('chevron')}</td></tr>`).join('');
 if(!c.submitted)return `${breadcrumb([['Responses','responses'],['Course evaluations','responses'],[`${c.code} · ${c.section}`,null]])}${pageHead(c.title,`${c.code} · ${c.course} · ${c.faculty} · ${c.year} · ${c.section}`,badge(c.status))}<section class="card card-pad"><div class="empty"><strong>No submitted evidence yet</strong>This evaluation has ${c.assigned} eligible students, but no submitted responses. Participation can be monitored without fabricating quantitative results.</div></section>`;
 const mappings={"CILO 1":[['PLO 1','L'],['PLO 3','P']],"CILO 2":[['PLO 2','P']],"CILO 3":[['PLO 4','L'],['PLO 1','O']]};
 const descriptions={"CILO 1":'Apply new literacies and course concepts in authentic teaching contexts',"CILO 2":'Select strategies appropriate to learner and task needs',"CILO 3":'Reflect on professional practice and explain improvements'};
 const ciloRows=st.boundQuestions.map(q=>`<tr><td><span class="strong">${q.cilo}</span><span class="subcell">${descriptions[q.cilo]}</span></td><td>${mappings[q.cilo].map(([p,m])=>`${manifestationBadge(m)} ${p}`).join(' &nbsp; ')}</td><td class="right">${q.ratings}</td><td class="right">${mean(q.mean)}</td><td><button class="btn link small" data-route="analytics/outcomes">View outcome evidence</button></td></tr>`).join('');
 const qRows=qs.map(q=>`<tr><td class="strong">${q.id}</td><td>${q.text}<div class="question-kind">${q.cilo?'Outcome evidence question':'General questionnaire item'}</div></td><td>${q.cilo?`<span class="badge cyan">${q.cilo}</span>`:'<span class="binding-general">General evaluation item</span>'}</td><td class="right">${q.ratings}</td><td class="right">${mean(q.mean)}</td><td style="min-width:265px">${likertBlock(q.dist,['1','2','3','4','5']).replace(/<details class="exact-values">[\s\S]*<\/details>/,'')}</td></tr>`).join('');
 return `${breadcrumb([['Responses','responses'],['Course evaluations','responses'],[`${c.code} · ${c.section}`,null]])}${pageHead(c.title,`${c.code} · ${c.course} · ${c.faculty} · ${c.year} · ${c.section}`,`<span class="badge ${c.status==='Closed'?'success':'info'}">${c.status}</span><button class="btn" data-trace="evaluation">${icon('info')} Evidence trail</button><button class="btn" data-route="analytics/courses">${icon('chart')} Course analytics</button>`)}
 <div class="source-note"><strong>Two different metrics:</strong> the evaluation quantitative mean uses all ${st.ratingCount} valid Likert answers from ${qs.length} quantitative questions. CILO means use only the ${st.boundQuestions.length} questions explicitly bound to CILOs. Unbound questions never become CILO or PLO evidence.</div>
 <div class="summary-strip">${miniStat('Submitted',`${c.submitted} / ${c.assigned}`,`${pct(c.submitted,c.assigned)}% completion`)}${miniStat('Evaluation quantitative mean',`${mean(st.mean)} / 5`,`${st.ratingCount} valid ratings across all Likert items`)}${miniStat('CILO evidence',`${st.boundQuestions.length} CILOs`,`${st.boundQuestions.length} bound questions in this mock instrument`)}${miniStat('Qualitative answers',c.qual,'Comments remain separate from quantitative means')}</div>
 <section class="card card-pad"><div class="card-head"><div><h2>CILO results</h2><div class="card-title-sub">Only outcome-bound questions participate. PLO mappings and manifestations remain visible.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>CILO</th><th>PLO mappings</th><th class="right">Ratings</th><th class="right">CILO mean</th><th></th></tr></thead><tbody>${ciloRows}</tbody></table></div><div class="calculation-note" style="margin-top:12px">CILO means are not averaged back into the evaluation quantitative mean. Both metrics derive directly from answer items using different eligible subsets.</div></section>
 <section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Question results</h2><div class="card-title-sub">Binding column makes the analytical role of every Likert item explicit.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Question</th><th>Outcome binding</th><th class="right">Ratings</th><th class="right">Question mean</th><th>Likert distribution</th></tr></thead><tbody>${qRows}</tbody></table></div></section>
 <div class="two-col" style="margin-top:16px"><section class="card card-pad"><div class="card-head"><div><h2>Qualitative summary</h2><div class="card-title-sub">${c.qual} answers from 27 respondents.</div></div><button class="btn small" data-route="analytics/qualitative">Open Qualitative</button></div><div class="chart-bars"><div class="bar-row"><div class="bar-label">laboratory</div><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><div class="bar-value">14</div></div><div class="bar-row"><div class="bar-label">projects</div><div class="bar-track"><div class="bar-fill" style="width:78%"></div></div><div class="bar-value">11</div></div><div class="bar-row"><div class="bar-label">feedback</div><div class="bar-track"><div class="bar-fill" style="width:64%"></div></div><div class="bar-value">9</div></div></div></section><section class="card card-pad"><div class="card-head"><div><h2>Participation</h2><div class="card-title-sub">Eligibility and submission status for this class.</div></div></div><div class="progress-list"><div class="progress-row" style="grid-template-columns:100px 1fr 60px"><div class="progress-label">Submitted</div><div class="stack"><span class="submitted" style="width:${c.submitted/c.assigned*100}%"></span></div><div class="progress-meta">${c.submitted}</div></div><div class="progress-row" style="grid-template-columns:100px 1fr 60px"><div class="progress-label">In progress</div><div class="stack"><span class="inprogress" style="width:${c.inProgress/c.assigned*100}%"></span></div><div class="progress-meta">${c.inProgress}</div></div><div class="progress-row" style="grid-template-columns:100px 1fr 60px"><div class="progress-label">Not started</div><div class="stack"><span class="notstarted" style="width:${Math.max(0,c.assigned-c.submitted-c.inProgress)/c.assigned*100}%"></span></div><div class="progress-meta">${Math.max(0,c.assigned-c.submitted-c.inProgress)}</div></div></div></section></div>

function centralDetail(id){
 const c=mock.central.find(x=>x.id===id)||mock.central[0]; const res=mock.respondents.filter(r=>r.central===id); const names=res.length?res:mock.respondents.slice(5);
 const rows=names.map(r=>`<tr class="clickable" data-route="responses/program-wide/${c.id}/responses/${r.id}"><td><span class="strong linkish">${r.name}</span></td><td>${r.major}</td><td>${r.year}</td><td>${r.section}</td><td>${r.submitted}</td><td class="right">${mean(r.mean)}</td><td>${icon('chevron')}</td></tr>`).join('');
 const src=c.stakeholder==='Alumni'?'alumni':c.stakeholder==='Industry partners'?'industry':'centralStudents'; const plos=mock.ploSources[src];
 const ploRows=plos.map(x=>`<tr><td class="strong">${x.code}</td><td>The program developed competencies represented by ${x.code}.</td><td class="right">${x.ratings}</td><td class="right">${mean(weightedMean(distributionForMean(x.mean,100)))}</td><td class="right">${x.responses}</td><td><button class="btn link small" data-route="analytics/outcomes">View PLO evidence</button></td></tr>`).join('');
 const questionRows=[['Q1','The program developed my ability to communicate effectively in professional settings.','PLO 1',4.24],['Q2','The program prepared me to apply professional and ethical standards.','PLO 4',4.10],['Q3','Program services and evaluation instructions were clear.',null,4.18],['Q4','The program prepared me to use appropriate digital and research tools.','PLO 3',4.02]].map(([id,q,p,m])=>`<tr><td class="strong">${id}</td><td>${q}</td><td>${p?`<span class="badge cyan">${p}</span>`:'<span class="binding-general">General evaluation item</span>'}</td><td class="right">${c.submitted}</td><td class="right">${mean(weightedMean(distributionForMean(m,c.submitted)))}</td></tr>`).join('');
 return `${breadcrumb([['Responses','responses'],['Program-wide evaluations','responses'],[c.title,null]])}${pageHead(c.title,`${c.stakeholder} · ${c.target} · 2026-2027 First Semester`,`<span class="badge ${c.status==='Closed'?'success':'info'}">${c.status}</span><button class="btn" data-trace="central">${icon('info')} Evidence trail</button><button class="btn" data-route="analytics/outcomes">${icon('chart')} Outcomes analytics</button>`)}<div class="source-note"><strong>Program-wide metric:</strong> evaluation quantitative mean includes all valid Likert items. Direct PLO means use only questions published with that PLO binding. General questions remain outside PLO evidence.</div><div class="summary-strip">${miniStat('Submitted',`${c.submitted} / ${c.assigned}`,`${pct(c.submitted,c.assigned)}% completion`)}${miniStat('Evaluation quantitative mean',`${mean(c.mean)} / 5`,'All valid Likert items')}${miniStat('Direct PLO evidence',`${plos.length} PLOs`,'Published question-to-PLO bindings')}${miniStat('Qualitative answers',c.qual)}</div><section class="card card-pad"><div class="card-head"><div><h2>Direct PLO results</h2><div class="card-title-sub">Only directly bound quantitative questions participate in each PLO result.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>PLO</th><th>Bound question</th><th class="right">Ratings</th><th class="right">PLO mean</th><th class="right">Responses</th><th></th></tr></thead><tbody>${ploRows}</tbody></table></div></section><section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Question results</h2><div class="card-title-sub">Direct binding and general items stay visible as different analytical roles.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Question</th><th>PLO binding</th><th class="right">Ratings</th><th class="right">Question mean</th></tr></thead><tbody>${questionRows}</tbody></table></div></section><section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Submitted respondents</h2><div class="card-title-sub">Identified response review for authorized Program Heads.</div></div><span class="badge success">Submitted only</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Respondent</th><th>Major</th><th>Year</th><th>Section</th><th>Submitted</th><th class="right">Response quantitative mean</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function responseDetail(kind,evaluationId,responseId){
 const r=mock.respondents.find(x=>x.id===responseId)||mock.respondents[0]; const course=kind==='course'?(mock.courses.find(x=>x.id===evaluationId)||mock.courses[0]):null; const central=kind==='program-wide'?(mock.central.find(x=>x.id===evaluationId)||mock.central[0]):null;
 const back=kind==='course'?`responses/course/${evaluationId}`:`responses/program-wide/${evaluationId}`; const evalTitle=course?course.title:central.title; const context=course?`${course.code} · ${course.course} · ${course.faculty}`:`${central.stakeholder} · ${central.target}`;
 const quantCourse=[
  {q:'I can apply the concepts and skills described in the first course outcome.',rating:5,label:'Fully Achieved',cilo:'CILO 1',maps:[['PLO 1','L'],['PLO 3','P']]},
  {q:'I can select and use strategies appropriate to the learning task.',rating:4,label:'Mostly Achieved',cilo:'CILO 2',maps:[['PLO 2','P']]},
  {q:'The evaluation instructions and expectations were clear.',rating:4,label:'Mostly Achieved',cilo:null,maps:[]},
  {q:'The learning activities were organized in a way that supported the evaluation.',rating:4,label:'Mostly Achieved',cilo:null,maps:[]},
  {q:'I can reflect on my practice and explain how I would improve it.',rating:5,label:'Fully Achieved',cilo:'CILO 3',maps:[['PLO 4','L'],['PLO 1','O']]}
 ];
 const quantCentral=[
  {q:'The program developed my ability to communicate effectively in professional settings.',rating:5,label:'Strongly Agree',plo:'PLO 1'},
  {q:'The program prepared me to apply professional and ethical standards.',rating:4,label:'Agree',plo:'PLO 4'},
  {q:'Program services and evaluation instructions were clear.',rating:4,label:'Agree',plo:null},
  {q:'The program prepared me to use appropriate digital and research tools.',rating:4,label:'Agree',plo:'PLO 3'}
 ];
 const qs=course?quantCourse:quantCentral; const computed=responseMean(qs.map(q=>q.rating));
 const qHtml=qs.map((x,i)=>{const bound=course?!!x.cilo:!!x.plo;const tags=course?(x.cilo?`<span class="badge cyan">${x.cilo}</span>${x.maps.map(([p,m])=>`${manifestationBadge(m)}<span class="badge neutral">${p}</span>`).join('')}`:'<span class="binding-general">General evaluation item</span>'):(x.plo?`<span class="badge cyan">${x.plo}</span>`:'<span class="binding-general">General evaluation item</span>');return `<div class="answer-card ${bound?'outcome':'general'}"><div class="eyebrow">Question ${i+1}</div><div class="question">${x.q}</div><div class="answer-role">${tags}<span class="note">${bound?(course?'Contributes to CILO analytics and mapped PLO evidence':'Contributes to direct PLO evidence'):'Contributes only to this response and evaluation quantitative mean'}</span></div><div class="rating-answer"><div class="rating-number">${x.rating}</div><div><div class="rating-label">${x.label}</div><div class="rating-scale">${course?'1 Not Achieved · 2 Slightly Achieved · 3 Moderately Achieved · 4 Mostly Achieved · 5 Fully Achieved':'1 Strongly Disagree · 2 Disagree · 3 Neutral · 4 Agree · 5 Strongly Agree'}</div></div></div>${bound?`<button class="btn link small" style="margin-top:10px" data-trace="answer">Trace this answer ${icon('arrow')}</button>`:''}</div>`}).join('');
 return `${breadcrumb([['Responses','responses'],[course?'Course evaluations':'Program-wide evaluations','responses'],[course?`${course.code} · ${course.section}`:central.title,back],[r.name,null]])}<div class="respondent-head"><div class="identity"><div class="avatar">${r.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><h2>${r.name}</h2><p>BSED · ${r.major} · ${r.year} · ${r.section}</p><p>${evalTitle} · Submitted ${r.submitted}</p></div></div><div class="head-actions"><button class="btn" data-route="${back}">Back to evaluation</button><button class="btn" data-route="analytics/outcomes">Open Analytics</button></div></div><section class="card card-pad" style="margin-top:18px"><div class="card-head"><div><h2>Response context</h2><div class="card-title-sub">Read-only submitted response. Academic context is resolved for the evaluation term.</div></div><span class="badge success">Submitted</span></div><div class="detail-row"><div class="key">Evaluation</div><div class="value">${evalTitle}</div></div><div class="detail-row"><div class="key">Context</div><div class="value">${context}</div></div><div class="detail-row"><div class="key">Academic period</div><div class="value">2026-2027 · First Semester · ${course?course.period:central.period}</div></div><div class="detail-row"><div class="key">Response quantitative mean</div><div class="value"><strong>${mean(computed)} / 5</strong><span class="subcell">All ${qs.length} quantitative answers, including general items</span></div></div></section><section class="answer-section"><div class="card-head"><div><h2>Submitted answers</h2><div class="card-title-sub">Blue edge marks outcome-bound questions. Neutral edge marks general questionnaire items.</div></div></div>${qHtml}<div class="answer-card general"><div class="eyebrow">Guided open-ended response</div><div class="question">What aspects of the learning experience helped you most?</div><div class="text-answer">The project activities helped me connect the concepts to actual classroom situations. The feedback after each activity made the expectations clearer.</div></div><div class="answer-card general"><div class="eyebrow">Open-ended response</div><div class="question">What should be improved?</div><div class="text-answer">More time for consultation before the final project would help. Some deadlines were close together with other major subjects.</div></div></section><section class="card card-pad" style="margin-top:16px"><div class="card-head"><div><h2>Trace upward</h2><div class="card-title-sub">Follow this response back into the aggregates it actually contributes to.</div></div></div><div class="quick-grid"><button class="quick" data-route="${back}"><strong>Evaluation aggregate</strong><span>See this response inside the deployment totals</span></button><button class="quick" data-route="analytics/courses"><strong>Course analytics</strong><span>Compare this class with other course assignments</span></button><button class="quick" data-route="analytics/outcomes"><strong>Outcome analytics</strong><span>Inspect only outcome-bound evidence</span></button><button class="quick" data-route="dashboard"><strong>Dashboard</strong><span>Return to top-level Program summary</span></button></div></section>`;
}

function breadcrumb(items){return `<nav class="breadcrumb" aria-label="Breadcrumb">${items.map(([l,r],i)=>`${i?'<span>›</span>':''}${r?`<button data-route="${r}">${l}</button>`:`<span class="current">${l}</span>`}`).join('')}</nav>`}
function responses(){const p=state.route.split('/');if(p[1]==='course'&&p[2]&&p[3]==='responses')return responseDetail('course',p[2],p[4]);if(p[1]==='program-wide'&&p[2]&&p[3]==='responses')return responseDetail('program-wide',p[2],p[4]);if(p[1]==='course'&&p[2])return courseDetail(p[2]);if(p[1]==='program-wide'&&p[2])return centralDetail(p[2]);return responsesLanding()}

function render(){
 const view=document.getElementById('view'); if(state.route.startsWith('analytics'))view.innerHTML=analytics(); else if(state.route.startsWith('responses'))view.innerHTML=responses(); else view.innerHTML=dashboard(); hydrateIcons(view); bindView(); updateNav(); window.scrollTo(0,0);
}
function updateNav(){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));const top=state.route.startsWith('analytics')?'analytics/outcomes':state.route.startsWith('responses')?'responses':'dashboard';const el=document.querySelector(`.nav-item[data-route="${top}"]`);if(el)el.classList.add('active')}

function bindView(){
 document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();routeTo(el.dataset.route)}));
 document.querySelectorAll('[data-placeholder]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.placeholder,'This prototype focuses on Dashboard, Analytics and Responses.')));
 document.querySelectorAll('[data-analytics-tab]').forEach(el=>el.addEventListener('click',()=>routeTo('analytics/'+el.dataset.analyticsTab)));
 document.querySelectorAll('[data-response-tab]').forEach(el=>el.addEventListener('click',()=>{state.responseTab=el.dataset.responseTab;render()}));
 document.querySelectorAll('[data-plo-source]').forEach(el=>el.addEventListener('click',()=>{state.ploSource=el.dataset.ploSource;render()}));
 document.querySelectorAll('[data-plo],[data-analytics-plo]').forEach(el=>el.addEventListener('click',()=>{state.selectedPlo=el.dataset.plo||el.dataset.analyticsPlo;routeTo('analytics/outcomes')}));
 document.querySelectorAll('[data-qual-source]').forEach(el=>el.addEventListener('click',()=>{state.qualSource=el.dataset.qualSource;render()}));
 document.querySelectorAll('[data-go-stakeholder]').forEach(el=>el.addEventListener('click',()=>routeTo('analytics/stakeholders')));
 document.querySelectorAll('[data-trace]').forEach(el=>el.addEventListener('click',()=>openTrace(el.dataset.trace)));
 document.querySelectorAll('[data-course-drawer]').forEach(el=>el.addEventListener('click',()=>openCourseDrawer(el.dataset.courseDrawer)));
 const ci=document.getElementById('completionInfo');if(ci)ci.addEventListener('click',()=>{const p=document.getElementById('completionPopover');const open=!p.classList.contains('open');p.classList.toggle('open',open);ci.setAttribute('aria-expanded',String(open))});
 const wr=document.getElementById('wordRange');if(wr)wr.addEventListener('input',()=>{state.wordCount=Number(wr.value);const l=document.getElementById('wordCountLabel');if(l)l.textContent=state.wordCount;const arr=mock.qualitative[state.qualSource]||mock.qualitative.all;const take=arr.slice(0,Math.min(state.wordCount,arr.length));const max=Math.max(...take.map(x=>x[1]),1);document.getElementById('wordCloud').innerHTML=take.map(([w,c],i)=>{const size=11+Math.round(c/max*17);const col=['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--text-2)'][i%5];return `<span class="word" title="${c} mentions" style="font-size:${size}px;color:${col}">${w}</span>`}).join('')});
 const gen=document.getElementById('generateAI');if(gen)gen.addEventListener('click',()=>{gen.disabled=true;gen.textContent='Generating...';setTimeout(()=>{document.getElementById('aiResult').classList.add('open');gen.textContent='Regenerate';gen.disabled=false},650)});
 const cs=document.getElementById('responseCourseSearch');if(cs)cs.addEventListener('input',()=>{state.courseFilter.search=cs.value;clearTimeout(window.__s);window.__s=setTimeout(render,180)});
 const cst=document.getElementById('responseCourseStatus');if(cst){cst.value=state.courseFilter.status;cst.addEventListener('change',()=>{state.courseFilter.status=cst.value;render()})}
 const clear=document.getElementById('clearAnalytics');if(clear)clear.addEventListener('click',()=>{state.filters={period:'2026-2027 · First Semester',source:'all',stakeholder:'all',major:'all',year:'all'};showToast('Filters cleared','Analytics returned to the full selected period scope.')});
 document.querySelectorAll('[data-coverage-source]').forEach(el=>el.addEventListener('click',()=>{state.ploSource=el.dataset.coverageSource;state.selectedPlo=el.dataset.coveragePlo;render()}));
 const ap=document.getElementById('aPeriod');if(ap)ap.addEventListener('change',()=>showToast('Academic period changed',`${ap.value}. Mock values remain illustrative for interface review.`));
 const as=document.getElementById('aSource');if(as)as.addEventListener('change',()=>{state.filters.source=as.value;showToast('Evidence source filter',as.options[as.selectedIndex].text)});
 const ast=document.getElementById('aStake');if(ast)ast.addEventListener('change',()=>{state.filters.stakeholder=ast.value;if(ast.value==='Alumni')state.ploSource='alumni';else if(ast.value==='Industry partners')state.ploSource='industry';else if(ast.value==='Students'&&state.ploSource==='alumni')state.ploSource='centralStudents';render()});
 const am=document.getElementById('aMajor');if(am)am.addEventListener('change',()=>{state.filters.major=am.value;showToast('Major filter',am.options[am.selectedIndex].text)});
 const ay=document.getElementById('aYear');if(ay)ay.addEventListener('change',()=>{state.filters.year=ay.value;showToast('Year level filter',ay.options[ay.selectedIndex].text)});

}

function openDrawer(eyebrow,title,body){document.getElementById('drawerEyebrow').textContent=eyebrow;document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;hydrateIcons(document.getElementById('drawerBody'));document.getElementById('drawer').classList.add('open');document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';document.querySelectorAll('#drawerBody [data-route]').forEach(el=>el.addEventListener('click',()=>{closeDrawer();routeTo(el.dataset.route)}))}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow=''}
document.getElementById('drawerClose').addEventListener('click',closeDrawer);document.getElementById('drawerBackdrop').addEventListener('click',closeDrawer);
function openTrace(type){
 let title='Evidence trail',body='';
 if(type==='plo'){title=`${state.selectedPlo} calculation`;body=`<div class="evidence-trail"><div class="trail-step"><div class="trail-dot">1</div><div><div class="trail-title">Filtered evidence scope</div><div class="trail-note">BSED · 2026-2027 First Semester · ${sourceLabel(state.ploSource)}</div></div></div><div class="trail-step"><div class="trail-dot">2</div><div><div class="trail-title">Valid quantitative answers</div><div class="trail-note">Only submitted responses and valid ratings from the selected source enter this result.</div></div></div><div class="trail-step"><div class="trail-dot">3</div><div><div class="trail-title">Outcome binding</div><div class="trail-note">${state.ploSource==='course'?'Question binding identifies a CILO. The CILO mapping identifies the selected PLO and manifestation.':'Published program-wide question snapshot identifies the selected PLO directly.'}</div></div></div><div class="trail-step"><div class="trail-dot">4</div><div><div class="trail-title">Aggregate</div><div class="trail-note">PLO mean equals valid mapped rating sum divided by valid mapped rating count. Rating count and response count remain separate.</div></div></div></div><button class="btn primary" style="margin-top:10px" data-route="responses">Inspect underlying responses</button>`}
 else if(type==='evaluation'){title='Course evaluation evidence trail';body=`<div class="evidence-trail"><div class="trail-step"><div class="trail-dot">1</div><div><div class="trail-title">Course assignment</div><div class="trail-note">EDUC 7 · Dr. Mia Reyes · 3rd Year · Morning</div></div></div><div class="trail-step"><div class="trail-dot">2</div><div><div class="trail-title">Evaluation assignments</div><div class="trail-note">35 eligible students received this evaluation.</div></div></div><div class="trail-step"><div class="trail-dot">3</div><div><div class="trail-title">Submitted responses</div><div class="trail-note">31 submitted responses contribute to the evaluation results.</div></div></div><div class="trail-step"><div class="trail-dot">4</div><div><div class="trail-title">Question and CILO aggregates</div><div class="trail-note">All quantitative answers feed the evaluation mean. Only outcome-bound answers feed CILO and mapped PLO aggregates.</div></div></div><div class="trail-step"><div class="trail-dot">5</div><div><div class="trail-title">PLO evidence</div><div class="trail-note">Mapped Learning and Practice CILOs can be inspected in Outcomes Analytics. Opportunity mappings remain structural context.</div></div></div></div>`}
 else if(type==='central'){title='Program-wide evidence trail';body=`<div class="evidence-trail"><div class="trail-step"><div class="trail-dot">1</div><div><div class="trail-title">Published deployment</div><div class="trail-note">Audience and target scope are frozen for this evaluation cycle.</div></div></div><div class="trail-step"><div class="trail-dot">2</div><div><div class="trail-title">Evaluation assignments</div><div class="trail-note">Assigned respondents produce completion denominators.</div></div></div><div class="trail-step"><div class="trail-dot">3</div><div><div class="trail-title">Submitted answers</div><div class="trail-note">Only submitted response bodies appear in identified Program Head review.</div></div></div><div class="trail-step"><div class="trail-dot">4</div><div><div class="trail-title">Publication-time PLO snapshot</div><div class="trail-note">Section key and item key connect each quantitative answer to its frozen PLO binding.</div></div></div></div>`}
 else {title='Answer evidence trail';body=`<div class="evidence-trail"><div class="trail-step"><div class="trail-dot">1</div><div><div class="trail-title">Maria Santos submitted rating 5</div><div class="trail-note">Exact answer remains attached to the immutable submitted response.</div></div></div><div class="trail-step"><div class="trail-dot">2</div><div><div class="trail-title">Published question</div><div class="trail-note">"I can apply new literacies in teaching contexts."</div></div></div><div class="trail-step"><div class="trail-dot">3</div><div><div class="trail-title">CILO 1</div><div class="trail-note">Question was bound to CILO 1 for this course evaluation.</div></div></div><div class="trail-step"><div class="trail-dot">4</div><div><div class="trail-title">PLO 1 · Learning</div><div class="trail-note">Current CILO mapping connects CILO 1 to PLO 1 with Learning manifestation.</div></div></div><div class="trail-step"><div class="trail-dot">5</div><div><div class="trail-title">PLO aggregate</div><div class="trail-note">This valid rating is one contributing rating inside the selected course evidence result.</div></div></div></div><button class="btn primary" style="margin-top:10px" data-route="analytics/outcomes">Open PLO analytics</button>`}
 openDrawer('Traceability',title,body)
}
function openCourseDrawer(id){const c=mock.courses.find(x=>x.id===id);const st=courseEvaluationStats(c);const cilo=st.boundQuestions.map(q=>`<div class="bar-row"><div class="bar-label">${q.cilo}</div><div class="bar-track"><div class="bar-fill" style="width:${q.mean/5*100}%"></div></div><div class="bar-value">${mean(q.mean)}</div></div>`).join('');openDrawer('Course assignment',`${c.code} · ${c.section}`,`<p style="color:var(--muted);font-size:12px">${c.course}</p><div class="summary-strip" style="grid-template-columns:1fr 1fr;margin-top:14px">${miniStat('Completion',`${c.submitted}/${c.assigned}`)}${miniStat('Evaluation mean',mean(st.mean),'All Likert items')}${miniStat('Faculty',c.faculty)}${miniStat('Major',c.major)}</div><h3 style="margin:14px 0 8px">CILO results</h3><div class="chart-bars">${cilo||'<div class="empty">No submitted CILO evidence.</div>'}</div><div class="calculation-note" style="margin-top:12px">CILO results use bound questions only. General evaluation questions remain outside this profile.</div><button class="btn primary" style="margin-top:16px" data-route="responses/course/${id}">View evaluation and responses</button>`) }
function showToast(title,text){const t=document.getElementById('toast');document.getElementById('toastTitle').textContent=title;document.getElementById('toastText').textContent=text;t.classList.add('open');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('open'),2400)}

document.querySelectorAll('.nav-item[data-route]').forEach(el=>el.addEventListener('click',()=>routeTo(el.dataset.route)));document.querySelectorAll('.nav-item[data-placeholder]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.placeholder,'This prototype focuses on Dashboard, Analytics and Responses.')));
document.getElementById('themeToggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';showToast('Appearance changed',document.documentElement.dataset.theme==='dark'?'Dark appearance is active.':'Light appearance is active.')});
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('mobile-open'));
document.getElementById('globalPeriod').addEventListener('change',e=>showToast('Academic period',`Prototype scope changed to ${e.target.value}. Mock values remain fixed for layout review.`));
parseHash();
</script>
</body>
</html>
